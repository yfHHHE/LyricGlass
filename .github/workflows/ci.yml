name: Build and check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check synchronization logic
        run: ./scripts/check.sh
      - name: Check audio level analysis without recording
        run: ./scripts/check-pet-audio.sh
      - name: Build universal app
        run: ./scripts/build-app.sh --universal
      - name: Verify both architectures and signature
        run: |
          TASK_ARCHS="$(lipo -archs dist/LyricGlass.app/Contents/MacOS/LyricGlass)"
          [[ "$TASK_ARCHS" == *arm64* && "$TASK_ARCHS" == *x86_64* ]]
          codesign --verify --deep --strict dist/LyricGlass.app
